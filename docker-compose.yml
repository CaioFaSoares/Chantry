services:
  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: chantry_streamlit
    ports:
      - "12501:8501"
    volumes:
      - ./streamlit:/app
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    depends_on:
      - n8n
      - go-server

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: chantry_n8n
    ports:
      - "12678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_METRICS=true
      - WEBHOOK_URL=http://localhost:12678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    restart: unless-stopped

  pocketbase:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chantry_pocketbase
    ports:
      - "12090:8090"
    volumes:
      - ./pb_data:/pb_data
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    restart: unless-stopped
    command: ["./main", "serve", "--http=0.0.0.0:8090", "--dir=/pb_data"]

  go-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chantry_go_server
    ports:
      - "12000:12000"
    environment:
      - PORT=12000
      - POCKETBASE_URL=http://pocketbase:8090
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      - DISCORD_APP_ID=${DISCORD_APP_ID}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    restart: unless-stopped
    depends_on:
      - pocketbase
